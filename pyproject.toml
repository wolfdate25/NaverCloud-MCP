[project]
name = "ncp-mcp"
version = "0.1.0"
description = "MCP server for NAVER Cloud Platform"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.0.0,<2",
    "requests>=2.31.0",
    "boto3>=1.34.0",
]

[project.scripts]
ncp-mcp = "ncp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ncp_server.py"]
